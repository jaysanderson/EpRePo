  <text x="70" y="35" font-family="Inter, Manrope, 'Albert Sans', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.8" fill="url(#word)">EpRePo</text>
  <text x="71" y="53" font-family="Inter, Manrope, 'Albert Sans', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" letter-spacing="2.2" fill="#8a86a8">RESEARCH PORTAL</text>
